<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}

<!--
  This layout is written out here instead of coming from a theme, and the reason
  is not styling.

  Every off-the-shelf theme prints the repository owner's account name somewhere
  it considers harmless: a "View the Project on GitHub" line in the sidebar, a
  "maintained by <account>" line in the footer. On an ordinary project page that
  is fine. This is the page an app store links to as its privacy policy, and the
  person behind it does not want to be named on it. A theme decides that for us,
  in markup we never see, and can start deciding it again on any upgrade.

  So the page owns its own shell. There is nowhere for a name to reappear.
  If you ever put `theme:` back in _config.yml, read this paragraph first.
-->

<style>
  :root {
    --ink:      #23201c;
    --ink-soft: #57514a;
    --rule:     #e2ddd4;
    --paper:    #fbf9f5;
    --link:     #4a5b7a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink:      #e6e1d8;
      --ink-soft: #a49d93;
      --rule:     #35312c;
      --paper:    #171512;
      --link:     #9db0d2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 42rem; margin: 0 auto; padding: 3rem 16px 5rem; }
  h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 .5rem; letter-spacing: -.01em; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .5rem; }
  h3 { font-size: 1rem;    margin: 1.75rem 0 .4rem; }
  p, li { color: var(--ink); }
  em { color: var(--ink-soft); font-style: normal; }
  a { color: var(--link); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
  code { font-size: .92em; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { border: 1px solid var(--rule); padding: .45rem .6rem; text-align: left; vertical-align: top; }
  footer { margin-top: 3.5rem; padding-top: 1.25rem; border-top: 1px solid var(--rule);
           color: var(--ink-soft); font-size: .9rem; }
  footer a { color: var(--ink-soft); }
</style>
</head>
<body>
<main>
{{ content }}

<footer>
  <a href="/privacy/">Privacy Policy</a> · <a href="/support/">Support</a><br>
  Diary BFF · <a href="mailto:hello@diarybff.app">hello@diarybff.app</a>
</footer>
</main>
</body>
</html>
