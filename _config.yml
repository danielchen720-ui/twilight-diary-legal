# No `theme:` line on purpose --- see the comment at the top of
# _layouts/default.html. Every stock theme prints the repository owner's account
# name in its sidebar or footer, and this is the page an app store links to as a
# privacy policy. The page owns its own shell so there is nowhere for a name to
# come back.
# Written out in full on purpose. jekyll-redirect-from builds the root page's
# jump target from this value, and when it is missing the host fills it in from
# its own settings --- which, until the "Enforce HTTPS" box is ticked, is the
# insecure scheme. The symptom was that the front page bounced visitors DOWN
# from a secure page to an insecure one, silently, while every page it linked to
# was already served securely.
#
# The box still wants ticking (it is what makes the insecure entry point bounce
# up), but with this line the bounce is correct either way instead of depending
# on a setting nobody can see from the source.
url: https://diarybff.app
title: Diary BFF
description: Privacy Policy and Support
plugins:
  - jekyll-redirect-from
  # #2320: /sitemap.xml (and /robots.txt pointing at it) for Search Console. Pages with
  # `sitemap: false` in their front matter stay out --- /tiktok/ is noindex.
  - jekyll-sitemap

# Keep the repository's own notes out of what gets served. README.md has no front
# matter, so Jekyll would copy it through verbatim and serve it as a file --- and
# it lists the old addresses, account name and all.
exclude:
  - README.md
  - check

# #3060（后端部 11-11，#3058 核出来的）：根目录那 32 个 <slug>.md 是给 /llms.txt 用的原文，没有
# front matter。GitHub Pages 默认开着 jekyll-optional-front-matter（关不掉），它把这种 .md 也渲染成
# <slug>.html 页、jekyll-sitemap 照收 —— 线上 sitemap 76 条里 32 条是正牌 /<slug>/ 的重复页（无
# canonical、title 只有「Diary BFF」）。这里让那 32 个 .html 不进 sitemap，并套 md-twin：canonical +
# noindex + 跳回 /<slug>/。原 .md 照样原文发（llms.txt 的地址不变）。只管根目录：help/*/index.md 有
# front matter、不在根；README.md 上面 exclude 了。
defaults:
  - scope:
      path: "*.md"
    values:
      sitemap: false
      layout: md-twin
